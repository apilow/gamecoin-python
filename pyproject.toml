[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apilow-gamecoin"
dynamic = ["version"]
description = "Server SDK for Apilow GameCoin: the bank of your game (virtual currency, inventory, sales). No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Apilow" }]
keywords = ["gamecoin", "apilow", "game", "virtual currency", "in-game economy", "inventory", "wallet", "ledger", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://gamecoin.apilow.com"
Repository = "https://github.com/apilow/gamecoin-python"
Issues = "https://github.com/apilow/gamecoin-python/issues"
Changelog = "https://github.com/apilow/gamecoin-python/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamecoin = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "gamecoin._version.__version__" }
